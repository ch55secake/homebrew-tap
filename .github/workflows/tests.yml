name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@main
      - name: Register checked-out tap
        run: |
          tap_path="$(brew --repository)/Library/Taps/ch55secake/homebrew-tap"
          mkdir -p "$(dirname "${tap_path}")"
          ln -s "${GITHUB_WORKSPACE}" "${tap_path}"
      - name: Trust checked-out tap
        run: brew trust --tap ch55secake/tap
      - name: Test Caelum release renderer
        run: python3 -m unittest discover -s scripts/tests
      - name: Audit formulae
        run: brew audit --new --strict --online --tap ch55secake/tap
      - name: Check formula style
        run: brew style Formula/a/apollo.rb Formula/a/augur.rb Formula/c/convoy.rb Formula/g/glance.rb Formula/o/orbit.rb Formula/s/symphony.rb
      - name: Check Caelum package style
        if: ${{ hashFiles('Formula/c/caelum-cli.rb') != '' && hashFiles('Casks/caelum.rb') != '' }}
        run: brew style Formula/c/caelum-cli.rb Casks/caelum.rb

      - name: Check Concerta cask style
        if: ${{ hashFiles('Casks/concerta.rb') != '' }}
        run: brew style Casks/concerta.rb

      - name: Check Vela cask style
        if: ${{ hashFiles('Casks/vela.rb') != '' }}
        run: brew style Casks/vela.rb

  cask-audit:
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@main
      - name: Register checked-out tap
        run: |
          tap_path="$(brew --repository)/Library/Taps/ch55secake/homebrew-tap"
          mkdir -p "$(dirname "${tap_path}")"
          ln -s "${GITHUB_WORKSPACE}" "${tap_path}"
      - name: Trust checked-out tap
        run: brew trust --tap ch55secake/tap

      - name: Detect Caelum cask changes
        id: caelum-changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            range="${PR_BASE_SHA}...${CURRENT_SHA}"
          else
            if [[ "$PUSH_BEFORE_SHA" =~ ^0+$ ]]; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            range="${PUSH_BEFORE_SHA}..${CURRENT_SHA}"
          fi

          if git diff --quiet "$range" -- Casks/caelum.rb; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Audit Caelum cask
        if: ${{ steps.caelum-changes.outputs.changed == 'true' && hashFiles('Casks/caelum.rb') != '' }}
        run: brew audit --cask --strict --online ch55secake/tap/caelum

      - name: Audit Concerta cask
        if: ${{ hashFiles('Casks/concerta.rb') != '' }}
        run: brew audit --cask --strict --online --except audit_signing,audit_github_repository ch55secake/tap/concerta

      - name: Audit Vela cask
        if: ${{ hashFiles('Casks/vela.rb') != '' }}
        run: brew audit --cask --strict --online --except audit_signing,audit_github_repository ch55secake/tap/vela
